[project]
name = "hostpilot-backend"
version = "0.1.0"
description = "HostPilot API — monolite modulare FastAPI con worker outbox/job (AD-1)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.18",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
packages = ["app"]
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true

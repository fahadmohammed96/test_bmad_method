# CI (AR-11): lint, typecheck, test e build su ogni PR.
# Il contratto API committato (openapi.json + client TS generato) è
# verificato contro il codice dal job api-contract (AD-14).
#
# Postura supply-chain della pipeline:
# - OGNI action pinnata al commit SHA, comprese quelle di `actions/`
#   (il tag è mutabile, e un commento che afferma un controllo assente
#   è peggio di nessun commento);
# - installazioni da lockfile (`uv sync --locked`, `npm ci`) senza
#   esecuzione di script di terze parti (`--no-build`, `--ignore-scripts`);
# - il progetto locale non si installa in CI (`--no-install-project`):
#   i comandi girano dalla directory del backend, quindi
#   `uv run --no-sync --no-build` (nessun re-sync, nessuna build implicita);
# - `permissions:` esplicito e minimo (azione A2 della retrospettiva Epic 1):
#   un workflow di CI ha accesso al repository, ai segreti e alla rete, ed è
#   la superficie di attacco più privilegiata del progetto. Senza questo
#   blocco il GITHUB_TOKEN gira con i permessi di default del repository,
#   che possono includere la scrittura.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nessun job di questa pipeline scrive sul repository: leggono il codice,
# installano da lockfile e girano test. Un job che dovesse davvero scrivere
# dichiarerà il permesso che gli serve al proprio livello, non qui.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOSTPILOT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hostpilot_test
      HOSTPILOT_TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install
        run: uv sync --locked --no-build --no-install-project --group dev
      - name: Lint
        run: uv run --no-sync --no-build ruff check .
      - name: Format check
        run: uv run --no-sync --no-build ruff format --check .
      - name: Typecheck
        run: uv run --no-sync --no-build mypy
      - name: Test
        run: uv run --no-sync --no-build pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostpilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hostpilot_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync --locked --no-build --no-install-project
        working-directory: backend
      - name: Install frontend
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Install browsers
        # `npm exec --no`: usa il Playwright del lockfile, senza installare
        # pacchetti on-demand (a differenza di `npx`).
        run: npm exec --no --ignore-scripts -- playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E + a11y (axe)
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync --locked --no-build --no-install-project
        working-directory: backend
      - name: Export OpenAPI
        run: uv run --no-sync --no-build python scripts/export_openapi.py
        working-directory: backend
      - name: Install frontend
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Generate TS client
        run: npm run generate:api
        working-directory: frontend
      - name: Contratto e client committati allineati al codice
        run: git diff --exit-code -- backend/openapi.json frontend/lib/api/schema.d.ts

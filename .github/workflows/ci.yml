# CI (AR-11): lint, typecheck, test e build su ogni PR.
# Il contratto API committato (openapi.json + client TS generato) è
# verificato contro il codice dal job api-contract (AD-14).
#
# Postura supply-chain della pipeline:
# - OGNI action pinnata al commit SHA, comprese quelle di `actions/`
#   (il tag è mutabile, e un commento che afferma un controllo assente
#   è peggio di nessun commento);
# - installazioni da lockfile (`uv sync --locked`, `npm ci`) senza
#   esecuzione di script di terze parti (`--no-build`, `--ignore-scripts`);
# - il progetto locale non si installa in CI (`--no-install-project`):
#   i comandi girano dalla directory del backend, quindi
#   `uv run --no-sync --no-build` (nessun re-sync, nessuna build implicita);
# - `permissions:` esplicito e minimo (azione A2 della retrospettiva Epic 1):
#   un workflow di CI ha accesso al repository, ai segreti e alla rete, ed è
#   la superficie di attacco più privilegiata del progetto. Senza un blocco
#   esplicito il GITHUB_TOKEN gira con i permessi di default del repository,
#   che possono includere la scrittura. Qui il default è **nessun permesso**,
#   e ogni job si concede il proprio;
# - nessun dato controllato da chi apre la PR (titolo, corpo, nome del ramo)
#   viene interpolato con `${{ }}` dentro uno `run:`: passa da `env:`, perché
#   l'interpolazione avviene PRIMA che la shell veda lo script e un corpo con
#   `$(...)` diventerebbe codice eseguito dal runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Default DENY: il `GITHUB_TOKEN` nasce senza alcun permesso, e ogni job si
# concede esplicitamente quello che gli serve (Sonar `githubactions:S8264`).
#
# `contents: read` a livello di workflow — la forma precedente — lo dava anche
# ai job che non toccano il repository, e non è la stessa cosa: `base-della-pr`
# legge SOLO il payload dell'evento, e un job senza `contents` non può clonare
# il repository nemmeno per sbaglio. La postura minima di A2 resta, applicata
# più stretta di prima: nessun job scrive, e chi non legge non ha nemmeno la
# lettura.
permissions: {}

jobs:
  # La base della PR è `main` (MYL-49). Difesa strutturale contro l'incidente
  # del 26/07: la PR #36 conteneva un fix P0 ed era basata su
  # `story/2.1-feed-ical-import` invece che su `main`. È stata revisionata,
  # approvata e mergiata — nel ramo di story. Il P0 è rimasto fuori dal trunk
  # e nulla lo ha segnalato, perché ogni controllo aveva fatto il proprio
  # lavoro: i test erano verdi, la review era reale, il merge è avvenuto. Il
  # difetto stava fra i controlli, dove non guardava nessuno.
  #
  # Nessun checkout: al job serve solo il payload dell'evento, e un job che
  # non clona il repository non può eseguirne il codice.
  base-della-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Esplicito e vuoto, non omesso: «questo job non ha bisogno di
    # niente» è un'affermazione, e va scritta.
    permissions: {}
    steps:
      - name: La base della PR è `main`
        # Il corpo della PR passa da una VARIABILE D'AMBIENTE, mai
        # interpolato dentro `run:` con `${{ }}`: l'interpolazione avviene
        # prima che la shell veda lo script, quindi un corpo che contiene
        # backtick o `$(...)` diventerebbe codice eseguito dal runner con i
        # permessi del workflow. È la checklist di hardening §3.4 applicata al
        # job nuovo, e questo è l'unico campo di questa pipeline che un
        # estraneo può scrivere.
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "main" ]; then
            echo "Base: $BASE — ok."
            exit 0
          fi
          # L'eccezione esiste (una catena di story dipendenti è legittima) ma
          # va DICHIARATA e motivata, così la scelta resta scritta accanto al
          # merge invece di essere una svista indistinguibile da una decisione.
          #
          # `sed` POSIX e non `grep -P`: il PCRE di grep si rifiuta di girare
          # in un locale non UTF-8, e la guardia diverrebbe rossa per la
          # ragione sbagliata su un runner configurato diversamente.
          # `tr -d '\r'`: i corpi delle PR di GitHub arrivano con CRLF, e il
          # ritorno a capo finirebbe nella motivazione allungandola di uno.
          MOTIVAZIONE=$(printf '%s' "$CORPO" | tr -d '\r' \
            | sed -n 's/^Base non-main dichiarata:[[:space:]]*//p' \
            | sed -n '1p' | sed 's/[[:space:]]*$//')
          # Almeno 20 caratteri: una soglia rende la motivazione un atto
          # deliberato invece di una parola qualsiasi per zittire il cancello.
          if [ "${#MOTIVAZIONE}" -ge 20 ]; then
            echo "Base: $BASE — eccezione dichiarata: $MOTIVAZIONE"
            exit 0
          fi
          echo "::error::La base di questa PR è '$BASE', non 'main'."
          echo "Un lavoro mergiato in un ramo di story non arriva nel trunk, e"
          echo "nessun controllo lo segnala (MYL-49). Cambia la base a 'main',"
          echo "oppure aggiungi al corpo della PR una riga:"
          echo "  Base non-main dichiarata: <motivo, almeno 20 caratteri>"
          exit 1

  backend:
    runs-on: ubuntu-latest
    # Fa `actions/checkout`: gli serve leggere il repository, e nient'altro.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOSTPILOT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hostpilot_test
      HOSTPILOT_TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install
        run: uv sync --locked --no-build --no-install-project --group dev
      - name: Lint
        run: uv run --no-sync --no-build ruff check .
      - name: Format check
        run: uv run --no-sync --no-build ruff format --check .
      - name: Typecheck
        run: uv run --no-sync --no-build mypy
      - name: Test
        run: uv run --no-sync --no-build pytest
      # Lo schema del database corrisponde ai modelli (MYL-44). È il cancello
      # che avrebbe intercettato il modulo `calendario` non registrato in
      # `alembic/env.py`: una migrazione dimenticata non rompe nessun test —
      # la suite gira su un database costruito DALLE migrazioni, quindi vede
      # esattamente lo schema che le migrazioni descrivono, coerente con se
      # stesso e diverso dai modelli. Il difetto compare al primo deploy.
      #
      # L'`upgrade` esplicito e non l'affidarsi allo stato lasciato da
      # `pytest`: un passo che dipende dall'effetto collaterale del passo
      # precedente sembra funzionare finché qualcuno non li riordina, e allora
      # confronta i modelli con uno schema arbitrario.
      - name: Schema allineato ai modelli (alembic check)
        env:
          HOSTPILOT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hostpilot_test
        run: |
          uv run --no-sync --no-build alembic upgrade head
          uv run --no-sync --no-build alembic check

  frontend:
    runs-on: ubuntu-latest
    # Fa `actions/checkout`: gli serve leggere il repository, e nient'altro.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Fa `actions/checkout`: gli serve leggere il repository, e nient'altro.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostpilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hostpilot_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync --locked --no-build --no-install-project
        working-directory: backend
      - name: Install frontend
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Install browsers
        # `npm exec --no`: usa il Playwright del lockfile, senza installare
        # pacchetti on-demand (a differenza di `npx`).
        run: npm exec --no --ignore-scripts -- playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E + a11y (axe)
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  api-contract:
    runs-on: ubuntu-latest
    # Fa `actions/checkout`: gli serve leggere il repository, e nient'altro.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync --locked --no-build --no-install-project
        working-directory: backend
      - name: Export OpenAPI
        run: uv run --no-sync --no-build python scripts/export_openapi.py
        working-directory: backend
      - name: Install frontend
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Generate TS client
        run: npm run generate:api
        working-directory: frontend
      - name: Contratto e client committati allineati al codice
        run: git diff --exit-code -- backend/openapi.json frontend/lib/api/schema.d.ts

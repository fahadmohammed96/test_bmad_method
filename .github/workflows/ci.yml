# CI (AR-11): lint, typecheck, test e build su ogni PR.
# Il contratto API committato (openapi.json + client TS generato) è
# verificato contro il codice dal job api-contract (AD-14).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOSTPILOT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hostpilot_test
      HOSTPILOT_TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostpilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hostpilot_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E + a11y (axe)
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync --group dev
        working-directory: backend
      - name: Export OpenAPI
        run: uv run python scripts/export_openapi.py
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Generate TS client
        run: npm run generate:api
        working-directory: frontend
      - name: Contratto e client committati allineati al codice
        run: git diff --exit-code -- backend/openapi.json frontend/lib/api/schema.d.ts
